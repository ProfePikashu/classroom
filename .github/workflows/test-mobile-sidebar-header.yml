name: Test mobile sidebar and header

on:
  push:
    branches:
      - fix/mobile-course-header-compact-20261020
      - main
    paths:
      - frontend/css/pelusita-v2.css
      - frontend/css/mobile-course-header.css
      - frontend/curso-ayrpc-2025.html
      - frontend/curso-ayrpc-2026.html
      - tests/mobile-sidebar-header.test.js
      - .github/workflows/test-mobile-sidebar-header.yml
  pull_request:
    paths:
      - frontend/css/pelusita-v2.css
      - frontend/css/mobile-course-header.css
      - frontend/curso-ayrpc-2025.html
      - frontend/curso-ayrpc-2026.html
      - tests/mobile-sidebar-header.test.js
      - .github/workflows/test-mobile-sidebar-header.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mobile sidebar/header regression
        run: node tests/mobile-sidebar-header.test.js
