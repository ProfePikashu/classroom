name: Test attendance token regeneration

on:
  push:
    branches:
      - fix/attendance-regenerate-token

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow replacing an active attendance code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/js/clases-ayrpc-2026.js')
          source = path.read_text(encoding='utf-8-sig')
          old = '''      generateBtn.disabled =
        !canGenerate ||
        !isThisClassOpen ||
        codeActive;
'''
          new = '''      generateBtn.disabled =
        !canGenerate ||
        !isThisClassOpen;
'''
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/attendance-refresh-state.test.js
      - name: Commit fix to branch
        shell: bash
        run: |
          if git diff --quiet -- frontend/js/clases-ayrpc-2026.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/clases-ayrpc-2026.js
          git commit -m "fix: allow regenerating active attendance codes"
          git push
