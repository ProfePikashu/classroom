name: Test attendance token regeneration

on:
  push:
    branches:
      - fix/attendance-regenerate-token

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow replacing an active attendance code
        run: python -c "from pathlib import Path; p=Path('frontend/js/clases-ayrpc-2026.js'); s=p.read_text(encoding='utf-8-sig'); old='      generateBtn.disabled =\\n        !canGenerate ||\\n        !isThisClassOpen ||\\n        codeActive;\\n'; new='      generateBtn.disabled =\\n        !canGenerate ||\\n        !isThisClassOpen;\\n'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/attendance-refresh-state.test.js
      - name: Commit fix to branch
        shell: bash
        run: |
          if git diff --quiet -- frontend/js/clases-ayrpc-2026.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/clases-ayrpc-2026.js
          git commit -m "fix: allow regenerating active attendance codes"
          git push
