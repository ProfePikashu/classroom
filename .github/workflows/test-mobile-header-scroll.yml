name: Test mobile header scroll compact

on:
  push:
    branches:
      - main
    paths:
      - frontend/css/pelusita-v2.css
      - frontend/js/main.js
      - frontend/*.html
      - tests/mobile-header-scroll-compact.test.js
      - .github/workflows/test-mobile-header-scroll.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check main.js syntax
        run: node --check frontend/js/main.js
      - name: Run mobile header compact test
        run: node tests/mobile-header-scroll-compact.test.js
