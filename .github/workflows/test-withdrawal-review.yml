name: Test withdrawal review frontend

on:
  push:
    branches:
      - feat/withdrawal-review-actions
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run withdrawal review contract
        run: node tests/test-alumnos-withdrawal-review.mjs
      - name: Check module syntax when present
        run: |
          if [ -f frontend/js/alumnos-withdrawal-review.js ]; then
            node --check frontend/js/alumnos-withdrawal-review.js
          fi
