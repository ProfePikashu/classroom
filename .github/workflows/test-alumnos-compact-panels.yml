name: Test compact alumnos cards

on:
  push:
    branches:
      - fix/compact-alumnos-admin-cards

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/alumnos-compact-panels.test.js
