name: Temporary update Class 1 recovery contract

on:
  push:
    branches:
      - fix/class1-recovery-contract-after-class2
    paths:
      - .github/workflows/temp-update-class1-recovery-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/class1-recovery-contract-after-class2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update stale contract assertions
        run: python tools/update_class1_recovery_contract.py

      - name: Verify updated recovery contracts
        shell: bash
        run: |
          node --check frontend/js/ayrpc2026-recovery.js
          node --check frontend/js/ayrpc2026-recovery-ux.js
          node tests/ayrpc2026-class1-recovery.test.js
          node tests/ayrpc2026-recovery-edge.test.js
          node tests/ayrpc2026-player-policy.test.js

      - name: Commit test-only fix and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-update-class1-recovery-contract.yml tools/update_class1_recovery_contract.py
          git add tests/ayrpc2026-class1-recovery.test.js tests/ayrpc2026-recovery-edge.test.js
          git diff --cached --check
          git commit -m "test: adaptar contratos de recuperación al motor multiclase"
          git push origin HEAD:fix/class1-recovery-contract-after-class2
