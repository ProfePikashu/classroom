name: Apply runtime load shedding

on:
  push:
    branches:
      - fix/runtime-load-shedding-20261020
    paths:
      - .github/workflows/apply-runtime-load-shedding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-load-shedding-20261020
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply minimal runtime load-shedding patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          notifications_path = Path('frontend/js/notifications-local.js')
          text = notifications_path.read_text(encoding='utf-8')

          old_poll = '  const POLL_MS = 20000;'
          new_poll = '  const POLL_MS = 60000;'
          if old_poll not in text:
              raise SystemExit('No se encontró POLL_MS=20000')
          text = text.replace(old_poll, new_poll, 1)

          ws_marker = '(function notificationsRealtimeWebSocketBridge() {'
          ws_pos = text.find(ws_marker)
          if ws_pos < 0:
              raise SystemExit('No se encontró el bridge WebSocket')

          strict_pattern = re.compile(
              r'(\(function notificationsRealtimeWebSocketBridge\(\) \{\r?\n  "use strict";\r?\n)'
          )
          text, count = strict_pattern.subn(
              r'\1\n  const REALTIME_WS_ENABLED = false;\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('No se pudo insertar REALTIME_WS_ENABLED')

          init_pattern = re.compile(
              r'(\(function notificationsRealtimeWebSocketBridge\(\) \{[\s\S]*?)(  function init\(\) \{\r?\n\s+setTimeout\(connect, 1200\);)',
              re.MULTILINE,
          )
          init_replacement = (
              r'\1  function init() {\n'
              r'    if (!REALTIME_WS_ENABLED) {\n'
              r'      manuallyClosed = true;\n'
              r'      document.documentElement.classList.remove("notifications-ws-ready");\n'
              r'      return;\n'
              r'    }\n\n'
              r'    setTimeout(connect, 1200);'
          )
          text, count = init_pattern.subn(init_replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró init del WebSocket')

          notifications_path.write_text(text, encoding='utf-8')

          for filename in ('curso-ayrpc-2025.js', 'curso-ayrpc-2026.js'):
              path = Path('frontend/js') / filename
              source = path.read_text(encoding='utf-8')

              course_init_pattern = re.compile(
                  r'  async init\(\) \{\r?\n'
                  r'    const session = this\.getSession\(\);\r?\n\r?\n'
                  r'    if \(!session\) return;\r?\n'
              )
              course_init_replacement = (
                  '  async init() {\n'
                  '    const session = this.getSession();\n\n'
                  '    if (!session) return;\n\n'
                  '    if (this.isTeacherSession(session)) {\n'
                  '      return;\n'
                  '    }\n'
              )
              source, count = course_init_pattern.subn(
                  course_init_replacement,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'No se encontró init esperado en {filename}')

              get_session_pattern = re.compile(
                  r'  getSession\(\) \{\r?\n'
                  r'    if \(typeof ClassroomAuth === "undefined"\) return null;\r?\n'
                  r'    return ClassroomAuth\.getSession\(\);\r?\n'
                  r'  \},\r?\n'
              )
              get_session_replacement = (
                  '  getSession() {\n'
                  '    if (typeof ClassroomAuth === "undefined") return null;\n'
                  '    return ClassroomAuth.getSession();\n'
                  '  },\n\n'
                  '  isTeacherSession(session) {\n'
                  '    const role = String(\n'
                  '      session?.backendRole ||\n'
                  '      session?.exampro?.role ||\n'
                  '      session?.role ||\n'
                  '      ""\n'
                  '    ).trim().toLowerCase();\n\n'
                  '    return role === "docente" || role === "teacher";\n'
                  '  },\n'
              )
              source, count = get_session_pattern.subn(
                  get_session_replacement,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'No se encontró getSession esperado en {filename}')

              path.write_text(source, encoding='utf-8')
          PY

      - name: Verify targeted regression
        run: node tests/runtime-load-shedding.test.js

      - name: Check all frontend JavaScript syntax
        shell: bash
        run: |
          for js in frontend/js/*.js; do
            node --check "$js"
          done

      - name: Run full test suite
        shell: bash
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node "$test"
          done

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-runtime-load-shedding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/notifications-local.js frontend/js/curso-ayrpc-2025.js frontend/js/curso-ayrpc-2026.js tests/runtime-load-shedding.test.js
          git commit -m "fix: reduce Classroom runtime database load"
          git push origin HEAD:fix/runtime-load-shedding-20261020
