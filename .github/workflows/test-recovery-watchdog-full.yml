name: Test recovery watchdog full suite

on:
  push:
    branches:
      - fix/recovery-tracker-watchdog
    paths:
      - frontend/clases-ayrpc-2026.html
      - frontend/js/ayrpc2026-recovery.js
      - frontend/js/ayrpc2026-recovery-ux.js
      - tests/**
      - .github/workflows/test-recovery-watchdog-full.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recovery JavaScript syntax
        run: |
          node --check frontend/js/ayrpc2026-recovery.js
          node --check frontend/js/ayrpc2026-recovery-ux.js
      - name: Run all Node tests
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "=== $test ==="
            node "$test"
          done
