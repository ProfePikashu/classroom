name: Test AyRPC 2026 live panel

on:
  push:
    branches:
      - fix/ayrpc2026-live-panel-progress
    paths:
      - frontend/curso-ayrpc-2026.html
      - frontend/js/curso-ayrpc-2026.js
      - tests/ayrpc2026-live-panel.test.js
      - .github/workflows/test-ayrpc2026-live-panel.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check course panel JavaScript syntax
        run: node --check frontend/js/curso-ayrpc-2026.js
      - name: Run live panel regression test
        run: node tests/ayrpc2026-live-panel.test.js
      - name: Run full Classroom Node suite
        run: |
          for test_file in tests/*.test.js; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
