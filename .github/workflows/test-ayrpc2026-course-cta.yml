name: Test AyRPC 2026 course CTA

on:
  push:
    paths:
      - 'frontend/curso-ayrpc-2026.html'
      - 'frontend/css/styles.css'
      - 'tests/ayrpc2026-course-cta.test.js'
      - '.github/workflows/test-ayrpc2026-course-cta.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run AyRPC 2026 course CTA test
        run: node --test tests/ayrpc2026-course-cta.test.js
