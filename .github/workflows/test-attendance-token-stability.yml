name: Test attendance token stability

on:
  push:
    branches:
      - fix/attendance-token-stability
      - main
    paths:
      - frontend/js/clases-ayrpc-2026.js
      - frontend/js/attendance-token-stability.js
      - frontend/clases-ayrpc-2026.html
      - tests/attendance-token-stability.test.mjs
      - .github/workflows/test-attendance-token-stability.yml
  pull_request:
    paths:
      - frontend/js/clases-ayrpc-2026.js
      - frontend/js/attendance-token-stability.js
      - frontend/clases-ayrpc-2026.html
      - tests/attendance-token-stability.test.mjs
      - .github/workflows/test-attendance-token-stability.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run attendance regression tests
        run: node --test tests/attendance-token-stability.test.mjs
      - name: Check stability script syntax
        run: node --check frontend/js/attendance-token-stability.js
