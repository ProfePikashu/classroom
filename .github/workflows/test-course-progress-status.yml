name: Test course progress status

on:
  push:
    branches:
      - fix/load-course-progress-status

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/load-course-progress-status
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch-course-progress-status.py
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/course-progress-status.test.js
      - name: Commit fix
        run: |
          if git diff --quiet -- frontend/js/clases-ayrpc-2026.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/clases-ayrpc-2026.js
          git commit -m "fix: load per-user course progress before rendering classes"
          git push
