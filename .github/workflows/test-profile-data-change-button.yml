name: Test profile data change button

on:
  push:
    branches:
      - fix/profile-data-change-button
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          node --check frontend/js/perfil.js
          node --check frontend/js/profile-data-change-requests-api.js
      - name: Run profile button contract
        run: node tests/test-profile-data-change-button.mjs
