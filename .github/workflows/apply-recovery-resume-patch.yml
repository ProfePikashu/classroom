name: Apply recovery resume patch

on:
  push:
    branches:
      - feat/recovery-resume-checkpoint
    paths:
      - scripts/apply_recovery_resume_review_fix.py
      - .github/workflows/apply-recovery-resume-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-resume-checkpoint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: python scripts/apply_recovery_resume_review_fix.py
      - name: Verify syntax and contract
        run: |
          node --check frontend/js/ayrpc2026-recovery.js
          node tests/ayrpc2026-class1-recovery.test.js
      - name: Commit patched file
        shell: bash
        run: |
          if git diff --quiet -- frontend/js/ayrpc2026-recovery.js; then
            echo "No review fix changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/ayrpc2026-recovery.js
          git commit -m "fix: polish recovery resume action"
          git push origin HEAD:feat/recovery-resume-checkpoint
