name: Test attendance registered refresh

on:
  push:
    branches:
      - fix/attendance-registered-refresh

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply registered attendance refresh fix
        run: python scripts/patch_attendance_registered_refresh.py
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/attendance-refresh-state.test.js
      - name: Clean temporary helpers and commit fix
        shell: bash
        run: |
          rm -f scripts/patch_attendance_registered_refresh.py
          rm -f .github/workflows/test-attendance-registered-refresh.yml
          rm -f noop-temp.txt noop-temp-2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: persist successful attendance notice after refresh"
          git push
