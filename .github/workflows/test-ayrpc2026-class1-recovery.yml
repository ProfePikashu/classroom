name: Test AyRPC 2026 class 1 recovery

on:
  push:
    branches:
      - feat/ayrpc2026-class1-recovery
      - main
      - fix/recovery-player-1x-captions-20261027
    paths:
      - frontend/clases-ayrpc-2026.html
      - frontend/js/clases-ayrpc-2026.js
      - frontend/js/ayrpc2026-recovery.js
      - frontend/js/ayrpc2026-recovery-ux.js
      - tests/ayrpc2026-class1-recovery.test.js
      - tests/ayrpc2026-player-policy.test.js
      - .github/workflows/test-ayrpc2026-class1-recovery.yml
  pull_request:
    paths:
      - frontend/clases-ayrpc-2026.html
      - frontend/js/clases-ayrpc-2026.js
      - frontend/js/ayrpc2026-recovery.js
      - frontend/js/ayrpc2026-recovery-ux.js
      - tests/ayrpc2026-class1-recovery.test.js
      - tests/ayrpc2026-player-policy.test.js
      - .github/workflows/test-ayrpc2026-class1-recovery.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recovery JavaScript syntax
        run: |
          node --check frontend/js/clases-ayrpc-2026.js
          node --check frontend/js/ayrpc2026-recovery.js
          node --check frontend/js/ayrpc2026-recovery-ux.js
      - name: Run recovery contract tests
        run: |
          node tests/ayrpc2026-class1-recovery.test.js
          node tests/ayrpc2026-player-policy.test.js
