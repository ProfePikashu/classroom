name: Apply AyRPC recovery question feedback

on:
  push:
    branches:
      - fix/recovery-question-feedback-20261027

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-question-feedback-20261027
      - name: Apply patch
        run: python tools/apply_recovery_question_feedback_patch.py
      - name: Commit patch when needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/js/ayrpc2026-recovery.js frontend/clases-ayrpc-2026.html tests/ayrpc2026-class1-recovery.test.js
            git commit -m "feat: show recovery result per answer"
            git push
          fi
