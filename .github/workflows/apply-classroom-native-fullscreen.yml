name: Apply Classroom native fullscreen

on:
  push:
    branches:
      - fix/classroom-native-fullscreen-landscape-20261027
    paths:
      - tools/apply_classroom_native_fullscreen.py
      - .github/workflows/apply-classroom-native-fullscreen.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/classroom-native-fullscreen-landscape-20261027
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize helper test anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_classroom_native_fullscreen.py")
          text = path.read_text(encoding="utf-8")
          marker = "# Keep legacy recovery contract aligned with cache-bust changes."
          if marker not in text:
              raise SystemExit("legacy test section not found")

          prefix = text.split(marker, 1)[0]
          suffix = """# Keep legacy recovery contract aligned with cache-bust changes.
          test_path = Path("tests/ayrpc2026-class1-recovery.test.js")
          test = test_path.read_text(encoding="utf-8")
          if test.count("20261027-bandwidth-v1") < 2:
              raise SystemExit("legacy bandwidth cache anchors not found")
          if "20261027-fullscreen-v3" not in test:
              raise SystemExit("legacy fullscreen cache anchor not found")
          test = test.replace("20261027-bandwidth-v1", "20261027-fullscreen-v4", 2)
          test = test.replace("20261027-fullscreen-v3", "20261027-fullscreen-v4", 1)
          test_path.write_text(test, encoding="utf-8")

          print("Classroom native fullscreen patch applied")
          """
          # Remove YAML indentation introduced inside the triple-quoted block.
          suffix = "\n".join(line[10:] if line.startswith("          ") else line for line in suffix.splitlines()) + "\n"
          path.write_text(prefix + suffix, encoding="utf-8")
          PY
      - name: Apply Classroom fullscreen patch
        run: python tools/apply_classroom_native_fullscreen.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/clases-ayrpc-2026.html \
            frontend/css/clases-ayrpc-2026.css \
            frontend/js/clases-ayrpc-2026.js \
            frontend/js/ayrpc2026-recovery.js \
            frontend/js/ayrpc2026-recovery-ux.js \
            tests/ayrpc2026-class1-recovery.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use Classroom-owned fullscreen on mobile"
          git push origin HEAD:fix/classroom-native-fullscreen-landscape-20261027
