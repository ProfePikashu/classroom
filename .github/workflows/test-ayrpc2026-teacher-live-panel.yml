name: Test AyRPC 2026 teacher live panel

on:
  push:
    branches:
      - fix/teacher-live-panel
    paths:
      - frontend/curso-ayrpc-2026.html
      - frontend/js/curso-ayrpc-2026-teacher-preview.js
      - tests/ayrpc2026-teacher-live-panel.test.js
      - .github/workflows/test-ayrpc2026-teacher-live-panel.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check teacher preview JavaScript syntax
        run: node --check frontend/js/curso-ayrpc-2026-teacher-preview.js
      - name: Run teacher live panel contract
        run: node tests/ayrpc2026-teacher-live-panel.test.js
