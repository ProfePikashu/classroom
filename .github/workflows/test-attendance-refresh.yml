name: Test classroom attendance refresh

on:
  push:
    branches:
      - fix/attendance-refresh-state

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/attendance-refresh-state.test.js
