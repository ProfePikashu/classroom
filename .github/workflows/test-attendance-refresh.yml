name: Test classroom attendance refresh

on:
  push:
    branches:
      - fix/attendance-refresh-state

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_attendance_refresh_fix.py
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/attendance-refresh-state.test.js
      - name: Commit fix to branch
        shell: bash
        run: |
          if git diff --quiet -- frontend/js/clases-ayrpc-2026.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/clases-ayrpc-2026.js
          git commit -m "fix: restore live attendance state after refresh"
          git push
