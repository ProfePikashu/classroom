name: Temporary Class 2 recovery frontend patch

on:
  push:
    branches:
      - prep/ayrpc2026-class2-final-rubric
    paths:
      - .github/workflows/temp-class2-frontend-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/ayrpc2026-class2-final-rubric
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic patch
        run: python tools/patch_class2_recovery_frontend.py

      - name: Verify JavaScript and expected Class 2 wiring
        shell: bash
        run: |
          node --check frontend/js/ayrpc2026-recovery.js
          node --check frontend/js/ayrpc2026-recovery-ux.js
          grep -q 'new Set(\[1, 2\])' frontend/js/ayrpc2026-recovery.js
          grep -q '2: 11400' frontend/js/ayrpc2026-recovery.js
          grep -q 'Clase 2 · Componentes de una PC' frontend/js/ayrpc2026-recovery.js
          grep -q 'new Set(\[1, 2\])' frontend/js/ayrpc2026-recovery-ux.js
          grep -q '20261102-class2-qa-v1' frontend/clases-ayrpc-2026.html

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-class2-frontend-patch.yml tools/patch_class2_recovery_frontend.py
          git add frontend/js/ayrpc2026-recovery.js frontend/js/ayrpc2026-recovery-ux.js frontend/clases-ayrpc-2026.html
          git diff --cached --check
          git commit -m "feat: habilitar preview y QA de recuperación Clase 2"
          git push origin HEAD:prep/ayrpc2026-class2-final-rubric
