name: Test attendance lock and expiry

on:
  push:
    branches:
      - fix/attendance-lock-and-expiry

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-lock-and-expiry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch-attendance-lock-expiry.py
      - run: node --check frontend/js/clases-ayrpc-2026.js
      - run: node tests/attendance-refresh-state.test.js
      - name: Commit fix
        run: |
          if git diff --quiet -- frontend/js/clases-ayrpc-2026.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/clases-ayrpc-2026.js
          git commit -m "fix: lock attendance after success and handle expired token"
          git push
