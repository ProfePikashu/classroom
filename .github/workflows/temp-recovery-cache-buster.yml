name: Temporary recovery cache buster update

on:
  push:
    branches:
      - refactor/ayrpc2026-recovery-registry
    paths:
      - .github/workflows/temp-recovery-cache-buster.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ayrpc2026-recovery-registry
      - name: Update recovery cache buster
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/clases-ayrpc-2026.html')
          text = path.read_text(encoding='utf-8')
          old = 'js/ayrpc2026-recovery.js?v=20261102-class2-switch-fix-v1'
          new = 'js/ayrpc2026-recovery.js?v=20261102-recovery-registry-v1'
          if old not in text:
              raise SystemExit('cache-buster esperado no encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- frontend/clases-ayrpc-2026.html
      - name: Commit cache buster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/clases-ayrpc-2026.html
          git commit -m "chore: bust recovery registry frontend cache"
          git push origin HEAD:refactor/ayrpc2026-recovery-registry
