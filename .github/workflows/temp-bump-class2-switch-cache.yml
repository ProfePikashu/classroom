name: Temporary bump Class 2 switch cache

on:
  push:
    branches:
      - fix/ayrpc2026-class2-player-switch-race
    paths:
      - .github/workflows/temp-bump-class2-switch-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ayrpc2026-class2-player-switch-race
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply cache-busters
        run: python tools/bump_class2_switch_cache.py

      - name: Verify syntax and all recovery contracts
        shell: bash
        run: |
          node --check frontend/js/clases-ayrpc-2026.js
          node --check frontend/js/ayrpc2026-recovery.js
          node --check frontend/js/ayrpc2026-recovery-ux.js
          node tests/ayrpc2026-class1-recovery.test.js
          node tests/ayrpc2026-recovery-edge.test.js
          node tests/ayrpc2026-player-policy.test.js
          node tests/ayrpc2026-class-switching.test.js

      - name: Commit cache-busters and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-bump-class2-switch-cache.yml tools/bump_class2_switch_cache.py
          git add frontend/clases-ayrpc-2026.html tests/ayrpc2026-class1-recovery.test.js
          git diff --cached --check
          git commit -m "chore: invalidar cache del fix de recuperación Clase 2"
          git push origin HEAD:fix/ayrpc2026-class2-player-switch-race
