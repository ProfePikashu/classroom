name: Apply visible-only notification polling

on:
  push:
    branches:
      - fix/notification-polling-visibility-20261020
    paths:
      - .github/workflows/apply-notification-polling-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-polling-visibility-20261020
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply notification polling patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/js/notifications-local.js')
          text = path.read_text(encoding='utf-8')

          if 'const POLL_MS = 60000;' not in text:
              raise SystemExit('No se encontró POLL_MS=60000')
          text = text.replace('const POLL_MS = 60000;', 'const POLL_MS = 300000;', 1)

          old_sync = '  async function syncBackendQuietly() {\n    if (syncInProgress) return;'
          new_sync = '''  async function syncBackendQuietly() {
              if (document.visibilityState !== "visible") {
                updateBellBadge();
                return;
              }

              if (syncInProgress) return;'''
          if old_sync not in text:
              raise SystemExit('No se encontró syncBackendQuietly esperado')
          text = text.replace(old_sync, new_sync, 1)

          wire_start = text.index('  function wireEvents() {')
          click_marker = '    document.addEventListener("click", (event) => {'
          click_pos = text.index(click_marker, wire_start)
          bell_refresh_listener = '''    document.addEventListener("click", (event) => {
              if (
                event.target.closest("#notificationsToggle") ||
                event.target.closest(".notifications-toggle") ||
                event.target.closest("[data-notifications-toggle]")
              ) {
                syncBackendQuietly();
              }
            }, true);

          '''
          text = text[:click_pos] + bell_refresh_listener + text[click_pos:]
          path.write_text(text, encoding='utf-8')

          runtime = Path('tests/runtime-load-shedding.test.js')
          rtext = runtime.read_text(encoding='utf-8')
          rtext = rtext.replace('/const\\s+POLL_MS\\s*=\\s*60000\\s*;/', '/const\\s+POLL_MS\\s*=\\s*300000\\s*;/')
          rtext = rtext.replace('de 60 segundos para reducir lecturas repetidas.', 'de 5 minutos para reducir lecturas repetidas.')
          runtime.write_text(rtext, encoding='utf-8')
          PY

      - name: Verify targeted regression
        run: node tests/notification-polling-visibility.test.js

      - name: Check all frontend JavaScript syntax
        shell: bash
        run: |
          for js in frontend/js/*.js; do
            node --check "$js"
          done

      - name: Run full test suite
        shell: bash
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node "$test"
          done

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-notification-polling-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/notifications-local.js tests/runtime-load-shedding.test.js tests/notification-polling-visibility.test.js .github/workflows/test-notification-polling-visibility.yml
          git commit -m "fix: reduce notification polling to visible five-minute fallback"
          git push origin HEAD:fix/notification-polling-visibility-20261020
