name: Apply withdrawn mail audience

on:
  push:
    branches:
      - fix/withdrawn-mail-audience
    paths:
      - .github/workflows/apply-withdrawn-mail-audience.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/withdrawn-mail-audience
          fetch-depth: 0

      - name: Patch notification center
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('frontend/centro-notificaciones.html')
          html = html_path.read_text(encoding='utf-8')

          old = '''    <option value="course-ayrpc-2026">AyRPC 2026</option>\n    <option value="staff">Staff</option>'''
          new = '''    <option value="course-ayrpc-2026">AyRPC 2026</option>\n    <option value="withdrawn">Dados de baja</option>\n    <option value="staff">Staff</option>'''
          if old not in html:
              raise SystemExit('hidden audience select anchor not found')
          html = html.replace(old, new, 1)

          staff_card = '''    <label class="notification-audience-card">\n      <input\n        type="radio"\n        name="notificationAudienceVisual"\n        value="staff"\n      />'''
          withdrawn_card = '''    <label class="notification-audience-card">\n      <input\n        type="radio"\n        name="notificationAudienceVisual"\n        value="withdrawn"\n      />\n      <span class="notification-audience-icon">\n        <i class="fa-solid fa-user-slash"></i>\n      </span>\n      <span>\n        <strong>Dados de baja</strong>\n        <small>Solo alumnos que solicitaron y tienen la baja aplicada.</small>\n      </span>\n    </label>\n\n'''
          if staff_card not in html:
              raise SystemExit('staff audience card anchor not found')
          html = html.replace(staff_card, withdrawn_card + staff_card, 1)
          html_path.write_text(html, encoding='utf-8')

          js_path = Path('frontend/js/centro-notificaciones.js')
          js = js_path.read_text(encoding='utf-8')

          old = '''    if (raw === "course-ayrpc-2025") return { audience_type: "course", course: "AyRPC 2025" };\n    if (raw === "course-ayrpc-2026") return { audience_type: "course", course: "AyRPC 2026" };\n\n    return {'''
          new = '''    if (raw === "course-ayrpc-2025") return { audience_type: "course", course: "AyRPC 2025" };\n    if (raw === "course-ayrpc-2026") return { audience_type: "course", course: "AyRPC 2026" };\n    if (raw === "withdrawn") return { audience_type: "withdrawn", course: null };\n\n    return {'''
          if old not in js:
              raise SystemExit('normalizeAudience anchor not found')
          js = js.replace(old, new, 1)

          old = '''    if (raw === "course-ayrpc-2025") return "AyRPC 2025";\n    if (raw === "course-ayrpc-2026") return "AyRPC 2026";\n\n    return value || "Todos";'''
          new = '''    if (raw === "course-ayrpc-2025") return "AyRPC 2025";\n    if (raw === "course-ayrpc-2026") return "AyRPC 2026";\n    if (raw === "withdrawn") return "Dados de baja";\n\n    return value || "Todos";'''
          if old not in js:
              raise SystemExit('audience label anchor not found')
          js = js.replace(old, new, 1)

          old = '''    if (raw === "course-ayrpc-2025") return "AyRPC 2025";\n    if (raw === "course-ayrpc-2026") return "AyRPC 2026";\n\n    return value || "Sin audiencia";'''
          new = '''    if (raw === "course-ayrpc-2025") return "AyRPC 2025";\n    if (raw === "course-ayrpc-2026") return "AyRPC 2026";\n    if (raw === "withdrawn") return "Dados de baja";\n\n    return value || "Sin audiencia";'''
          if old not in js:
              raise SystemExit('history audience label anchor not found')
          js = js.replace(old, new, 1)

          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "ProfePikashu"
          git config user.email "andyazh30@gmail.com"
          git add frontend/centro-notificaciones.html frontend/js/centro-notificaciones.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add withdrawn notification audience"
          git push origin HEAD:fix/withdrawn-mail-audience
