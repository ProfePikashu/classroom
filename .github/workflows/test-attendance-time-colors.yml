name: Test attendance time colors

on:
  push:
    branches:
      - fix/attendance-time-colors-2026

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated patch
        run: python scripts/patch-attendance-time-colors.py
      - name: Check JavaScript syntax
        run: node --check frontend/js/asistencias.js
      - name: Run attendance time regression
        run: node tests/attendance-time-colors.test.js
      - name: Run full Node test suite
        run: |
          set -e
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/asistencias.js tests/attendance-time-colors.test.js
          git rm scripts/patch-attendance-time-colors.py .github/workflows/test-attendance-time-colors.yml
          git commit -m "feat: show exact attendance time thresholds"
          git push origin HEAD:fix/attendance-time-colors-2026
