name: Test attendance time colors

on:
  push:
    branches:
      - fix/attendance-time-colors-2026

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/attendance-time-colors.test.js
